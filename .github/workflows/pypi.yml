name: Distribution Validation and Release

on:
  push:
    branches: [main, develop]
    tags: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bingo
        with:
          python-version: "3.13"
          dependencies: build
      - name: Build source distribution
        run: python -m build --sdist --outdir dist
      - name: Build Linux wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: dist
        env:
          CIBW_BUILD: "cp311-* cp312-* cp313-* cp314-*"
          CIBW_ARCHS_LINUX: x86_64
      - name: Verify clean directory
        run: git diff --exit-code
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          retention-days: 14

  metadata:
    name: Validate distribution metadata
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check package metadata
        run: python -m pip install --upgrade twine && twine check dist/*

  smoke-test-wheel:
    name: Smoke test wheel (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            wheel-tag: cp311
          - python-version: "3.12"
            wheel-tag: cp312
          - python-version: "3.13"
            wheel-tag: cp313
          - python-version: "3.14"
            wheel-tag: cp314
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Clean-install and import wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: dist/*${{ matrix.wheel-tag }}-*manylinux*.whl
          python -c "import bingo"

  smoke-test-sdist:
    name: Smoke test source distribution
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clean-install and import source distribution
        run: python -m pip install --upgrade pip && python -m pip install dist/*.tar.gz && python -c "import bingo"

  smoke-test-evidence-extra:
    name: Smoke test Evidence extra
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Clean-install and import Evidence extra
        shell: bash
        run: |
          python -m pip install --upgrade pip
          wheel=$(printf '%s\n' dist/*cp313-*manylinux*.whl)
          python -m pip install --only-binary=:all: "${wheel}[evidence]"
          python -c "import bingo.symbolic_regression; import smcpy"

  installed-tests:
    name: Installed artifact tests (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.13"
            wheel-tag: cp313
            dependencies: ".[MPI,ONNX,TESTS,evidence]"
          - python-version: "3.14"
            wheel-tag: cp314
            dependencies: ".[MPI,ONNX,TESTS,evidence]"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bingo
        with:
          python-version: ${{ matrix.python-version }}
          dependencies: ${{ matrix.dependencies }}
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Test installed wheel
        shell: bash
        run: |
          python -m pip uninstall --yes bingo-nasa
          python -m pip install --only-binary=:all: dist/*${{ matrix.wheel-tag }}-*manylinux*.whl
          mv bingo bingo-source
          tests/.run_tests.sh normal

  release-gate:
    name: Verify release tag and artifact version
    needs: [metadata, smoke-test-wheel, smoke-test-sdist, smoke-test-evidence-extra, installed-tests]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - id: version
        name: Verify exact release tag and package version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            prerelease=false
          elif [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+rc[0-9]+$ ]]; then
            prerelease=true
          else
            echo "Release tags must be X.Y.Z or X.Y.ZrcN, got: $tag" >&2
            exit 1
          fi
          python - "$tag" dist/* <<'PY'
          import email
          import sys
          import tarfile
          import zipfile

          expected, *artifacts = sys.argv[1:]
          for artifact in artifacts:
              if artifact.endswith(".whl"):
                  with zipfile.ZipFile(artifact) as distribution:
                      metadata_name = next(name for name in distribution.namelist()
                                           if name.endswith(".dist-info/METADATA"))
                      metadata = distribution.read(metadata_name)
              else:
                  with tarfile.open(artifact) as distribution:
                      metadata_member = next(member for member in distribution
                                             if member.name.endswith("/PKG-INFO"))
                      metadata = distribution.extractfile(metadata_member).read()
              version = email.message_from_bytes(metadata)["Version"]
              if version != expected:
                  raise SystemExit(f"{artifact} has version {version}, expected {expected}")
          PY
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish to PyPI
    needs: release-gate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  github-release:
    name: Sign distributions and create GitHub Release
    needs: [release-gate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - name: Sign distributions with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: dist/*.tar.gz dist/*.whl
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/** --repo "$GITHUB_REPOSITORY" --generate-notes ${{ needs.release-gate.outputs.prerelease == 'true' && '--prerelease' || '' }}
