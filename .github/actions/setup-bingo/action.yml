name: Set up Bingo
description: Prepare the checked-out Bingo repository's submodules, Python, MPI, and dependencies.
inputs:
  python-version:
    description: Python version to install.
    required: true
  dependencies:
    description: Pip requirement specifier to install after Python and MPI are ready.
    required: false
    default: .
  submodules:
    description: Whether to initialize submodules recursively.
    required: false
    default: "true"
  mpi:
    description: Whether to install MPI.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - name: Initialize submodules
      if: inputs.submodules == 'true'
      shell: bash
      run: git submodule update --init --recursive
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Set up MPI
      if: inputs.mpi == 'true'
      uses: mpi4py/setup-mpi@v1
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ inputs.dependencies }}"
    - name: Enable safe MPI forking
      shell: bash
      run: echo "RDMAV_FORK_SAFE=1" >> "$GITHUB_ENV"
    - name: Use portable MPI transport
      shell: bash
      run: echo "UCX_TLS=self,tcp" >> "$GITHUB_ENV"
